<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" th:replace="normal/base::layout(~{::section})">
<head>
<meta charset="UTF-8">
<title th:text="${title}"></title>
</head>
<body>

<section>
<div class="card mr-3 ml-3">
	<div class="card-body " th:if=${contact}>
	<h1 class="text-center">Current Contact Details</h1>
		<div class="text-center">
      <img style="width:200px; height:200px;" class="profile_photo" src="" th:src="@{'/image/'+${contact.image}}" alt="profile photo"/>
      <h3 class="mt-3"><span th:text="${contact.name}"></span>(<span th:text="${contact.secondName}"></span>)</h3>
      <table class="table">
  <thead>
    <tr>
      <th scope="col">#ID</th>
      <th scope="col">SCMUSER<span th:text="${contact.cId}"></span></th>
     
    </tr>
    <tr>
      <th scope="col">Email</th>
      <th scope="col"><span th:text="${contact.email}"></span></th>
     
    </tr>
    <tr>
      <th scope="col">Phone</th>
      <th scope="col"><span th:text="${contact.phone}"></span></th>
     
    </tr>
 
    <tr>
      <th scope="row">Work</th>
      <td><span th:text="${contact.work}"></span></td>
    
   
    </tr>
    <tr>
      
  </tbody>
</table>
	<div class="description mt-3">
	<th:block th:text="${contact.description}"></th:block>
	</div>
	<div class="container mt-3">
	<button class="btn btn-danger btn-small" th:onclick="|deleteContact(${contact.cId})|">Delete</button>
         <form method="post" th:action="@{'/user/update-contact/'+${contact.cId}}" class="mt-2">
      
      <button class="btn btn-primary btn-sm">Update</button>
      </form>
	</div>
	
      </div>
      </div>
      </div>
      <h1 class="test-center p-3 bg-danger"th:unless="${contact}">Don't have permission to see other user Contacts</h1>
</section>

</body>
</html>
