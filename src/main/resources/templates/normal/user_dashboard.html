<!DOCTYPE html  >

<html xmlns:th="http://thymeleaf.org" th:replace="normal/base::layout(~{::section})">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>

<body>
<section>

<div class="container">

            <div class="card">
                <div class="card-body">
                    <div class="container text-center">
<img class="profile_photo"
     style="width:200px;height:200px;"
     th:src="@{'/image/contacts.png'}"
     alt="Profile Photo">
     </div>

                    <h1 class="text-center mt-3 text-secondary font-italic font-weight-light">
                        Start Adding your contact on cloud...
                    </h1>
						<div class="container text-center">
                    <a th:href="@{/user/add-contact}" class="btn btn-primary mt-4 btn-block text-uppercase">Add New Contact</a>
                    
                    <hr>
                    <h3 class="my-3">Donate Us</h3>
                    <input type="text" id="payment_field"   class="form-control my-2" placeholder="Enter amount here" />
                    
                    <div class="container text-center mt-3">
                    <button onClick="paymentStart()" class="btn btn-success btn-block">PAY</button>
                    </div> 
                    
</div>

	
                </div>
            </div>

        </div>
        
        
</section>
</body>
</html>
