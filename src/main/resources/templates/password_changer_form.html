<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="base::layout(~{::section})">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="${title}">Change password form</title>
</head>
<body>
<section>
    <div id="login">
        <h3 class="text-center text-white pt-5">Login form</h3>
        <div class="container">
            <div id="login-row" class="row justify-content-center align-items-center">
                <div id="login-column" class="col-md-6">
                    <div id="login-box" style="height:250px;" class="col-md-12">
               <!-- email -->
               <h3 class="text-center m-3">Enter new password </h3>
             
               <form method="post" action="" th:action="@{/change-password}">
               
               	
               	<div class="form-group">
               	<div class="px-2">
               		<input name="newPassword" type="password"  placeholder="Enter new password here " class="form-control mb-2" required/>
               		
               		</div>
               	
               	</div>
               	<div class="text-center">
               	<button class="btn btn-success " type="submit">Change password</button>
               </div>
               </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
